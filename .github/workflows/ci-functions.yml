name: CI functions
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout のみ。書き込み権限は不要
    strategy:
      matrix:
        node: ['22']
    name: Node ${{ matrix.node }} CI firebase functions
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Audit root dependencies (fail on high/critical; moderate allowed)
        run: npm audit --audit-level=high
      - run: npm ci
      - name: Audit functions dependencies (fail on high/critical; moderate allowed)
        run: npm audit --audit-level=high
        working-directory: ./functions
      - run: npm ci
        working-directory: ./functions
      - run: npm run build
        working-directory: ./functions
